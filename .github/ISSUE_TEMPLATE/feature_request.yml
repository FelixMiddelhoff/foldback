name: Feature request
description: Propose new behavior or an API addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The concrete situation this doesn't currently handle well — not just "it would be nice if."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Sketch the API/behavior if you have one in mind. Not required — happy to discuss shape in the issue.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is a non-trivial change (new API, protocol change, new binding surface) — I understand this may need an RFC before implementation.
          required: false
