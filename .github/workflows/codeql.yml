name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, catches new query-pack findings on unchanged code, not just
    # findings introduced by a given push/PR.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Without this, a superseded run from an earlier push keeps executing to
# completion (and showing its own, possibly-already-fixed failures)
# instead of being replaced by the run for the newer commit — confusing
# when pushes land in quick succession, found by hitting it directly.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # rust: core/CLI/UI/bindings. csharp: the Unity binding, built
        # via the same dotnet console harness CI already uses. actions:
        # the workflow files themselves.
        #
        # c-cpp deliberately excluded, confirmed not just assumed: the
        # Unreal plugin's real C++ source (bindings/unreal/Source/) is
        # the only standalone C/C++ here, and CodeQL's C/C++ extractor
        # needs to trace an actual compiler invocation to extract
        # anything — tried it, got "CodeQL detected code written in
        # C/C++ but could not process any of it," because compiling
        # against UE's headers needs a real Unreal Engine install, which
        # (per bindings/unreal/README.md) has no scriptable install path
        # for a hosted runner. Same disclosed gap as that binding's own
        # missing CI leg, not a silent omission.
        language: [rust, csharp, actions]
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # C# needs an actual build for CodeQL to analyze (a compiled
      # language) — Rust's `autobuild` below handles the Cargo workspace
      # fine on its own.
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: matrix.language == 'csharp'
        run: dotnet build bindings/unity/Tests~/FoldbackSys.Tests

      # `actions` (scanning the workflow YAML itself) is interpreted, not
      # compiled — no build step needed, autobuild would be a no-op at
      # best.
      - if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
