name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, catches new query-pack findings on unchanged code, not just
    # findings introduced by a given push/PR.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Matches this repo's actual languages: Rust (the core/CLI/UI/
        # bindings), C# (the Unity binding), C/C++ (the Unreal plugin
        # and Godot's native gdext surface), and the workflow files
        # themselves.
        language: [rust, csharp, c-cpp, actions]
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # C#/C++ need an actual build for CodeQL to analyze (compiled
      # languages) — Rust's `autobuild` below handles the Cargo
      # workspace fine on its own, but the Unity harness and the C++
      # bindings need their own build commands.
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: matrix.language == 'csharp'
        run: dotnet build bindings/unity/Tests~/FoldbackSys.Tests

      - if: matrix.language == 'c-cpp'
        run: |
          echo "No standalone C/C++ build here — Unreal needs a full Unreal Engine \
          install (see bindings/unreal/README.md) and isn't buildable on a hosted \
          runner; Godot's C/C++ surface is generated gdext binding code compiled \
          as part of the Rust build. CodeQL's C/C++ extractor still scans the \
          checked-in headers/sources it can see without a full build."

      # `actions` (scanning the workflow YAML itself) is interpreted, not
      # compiled — no build step needed, autobuild would be a no-op at
      # best.
      - if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
