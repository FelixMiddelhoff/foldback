name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fmt-and-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # foldback-ui (Tauri) needs these to even compile on Linux — without
      # them `cargo clippy --workspace` fails on missing system libs, not
      # a lint finding. Same list `core-test`'s ubuntu-latest leg needs.
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all -- --check
      # --all-features so feature-gated code (e.g. foldback-rs's `ggrs`
      # module, off by default) actually gets compiled and linted here —
      # without it, a break in a non-default feature ships invisibly.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  core-test:
    name: test (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace --all-features

  # Cross-platform (incl. ARM64) hash-equality job, per
  # foldback-ci-release-plan.md §4.2 and foldback-testing-plan.md §1.4: the
  # `hash::tests::known_vectors` test asserts a fixed input hashes to a
  # pinned constant, so running it on every OS/arch here *is* the
  # cross-platform byte-identical-hash assertion. Also runs the same test
  # at opt-level 0 and 3 to catch compiler-introduced non-determinism in
  # the hashing path itself (FMA contraction, float codegen differences —
  # see poncelet-planning/writing/blog-bitexact-fma-hunt.md for the bug
  # class this guards against), independent of the game's own code.
  #
  # Per §4.2: a failure here is a release blocker, never a flaky-retry
  # candidate — this is the one job that, if ever skipped "just this
  # once," undermines the entire product's premise.
  determinism:
    name: determinism (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: known vectors at opt-level 0
        run: cargo test -p foldback-core hash::tests::known_vectors
        env:
          RUSTFLAGS: "-C opt-level=0"
      - name: known vectors at opt-level 3
        run: cargo test -p foldback-core hash::tests::known_vectors
        env:
          RUSTFLAGS: "-C opt-level=3"

  # Builds the real foldback-sys native library and runs the Unity C#
  # binding's own P/Invoke harness (bindings/unity/Tests~/FoldbackSys.Tests)
  # against it — proves the C# struct marshaling/error handling actually
  # works against real compiled native code, not just that the C# compiles.
  # This is the plain .NET (Mono-equivalent) P/Invoke path — see
  # bindings-unity-il2cpp below for the actual Unity IL2CPP AOT leg.
  bindings-unity-cs:
    name: bindings/unity C# harness (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cargo build -p foldback-sys
      - run: dotnet build -c Release bindings/unity/Tests~/FoldbackSys.Tests
      - name: Copy native library next to the test harness (Linux)
        if: runner.os == 'Linux'
        run: cp target/debug/libfoldback_sys.so bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/
      - name: Copy native library next to the test harness (macOS)
        if: runner.os == 'macOS'
        run: cp target/debug/libfoldback_sys.dylib bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/
      - name: Copy native library next to the test harness (Windows)
        if: runner.os == 'Windows'
        run: cp target/debug/foldback_sys.dll bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/
        shell: bash
      - run: dotnet bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/FoldbackSys.Tests.dll

  # The IL2CPP CI leg the risk register (P1) names as a Phase-3 "definition
  # of done" requirement — an actual Unity Editor, with the Windows Build
  # Support (IL2CPP) module, building and running examples/unity-demo
  # (Assets/Il2cppVerify.cs runs the same checks as the C# harness above,
  # but inside a real IL2CPP AOT player, which the Editor's own Mono
  # runtime never exercises). Proven working end to end both locally and
  # here in CI (real UNITY_EMAIL/UNITY_PASSWORD secrets, real
  # windows-latest run, real PASS output) — closes P1's Phase-3
  # requirement for real.
  #
  # `cache-installation: true` below caches the Hub+Editor+module install
  # between runs — a cache *miss* (first run ever, or after 7 days of
  # disuse, since GitHub evicts unused cache entries) is still a slow,
  # multi-gigabyte download, but every run after that should be fast.
  bindings-unity-il2cpp:
    name: bindings/unity IL2CPP player (windows-latest)
    needs: fmt-and-lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p foldback-sys
      - name: Stage the native library where the Unity project expects it
        shell: bash
        run: |
          mkdir -p examples/unity-demo/Assets/Plugins/x86_64
          cp target/debug/foldback_sys.dll examples/unity-demo/Assets/Plugins/x86_64/
      - uses: buildalon/unity-setup@v2
        with:
          unity-version: "6000.6.0f1"
          modules: windows-il2cpp
          # Caches the Hub+Editor+module install between runs (the action's
          # own built-in support, not a hand-rolled actions/cache step —
          # it knows which paths and Hub-state files actually need
          # caching for a subsequent run to recognize the install as
          # already done, which a naive directory-only cache wouldn't).
          cache-installation: true
      - uses: buildalon/activate-unity-license@v2
        with:
          # Personal license (the default `license: personal`) only needs
          # username/password — no serial, that's Professional-only.
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - name: Build the IL2CPP player
        shell: bash
        run: |
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit \
            -projectPath examples/unity-demo \
            -executeMethod BuildScript.BuildIl2Cpp \
            -logFile examples/unity-demo/build.log
          cat examples/unity-demo/build.log
      - name: Run the IL2CPP player and check the result
        shell: bash
        env:
          FOLDBACK_IL2CPP_RESULT_PATH: examples/unity-demo/il2cpp-result.txt
        run: |
          examples/unity-demo/Build/FoldbackIl2CppTest.exe -batchmode -nographics -silent-crashes \
            -logFile examples/unity-demo/run.log
          cat examples/unity-demo/il2cpp-result.txt
          grep -q "^PASS$" examples/unity-demo/il2cpp-result.txt

  # Phase 4 — Godot binding (cookbook recipe 9). Builds the real
  # foldback-godot cdylib, stages it into examples/godot-demo's GDExtension
  # addon folder, then runs a real Godot engine (downloaded directly from
  # the official godotengine/godot-builds release, same "verify the exact
  # URL rather than trust a wrapper action" lesson bindings-unity-il2cpp
  # learned the hard way) headlessly against test.gd — a straight-line
  # GDScript exercising the full binding surface (Level 1 divergence
  # detection, Level 2/3 recording round-tripped through a real .foldback
  # file, finish() agreement/disagreement, the unconfigured-session error
  # path) and printing "ALL PASS" only if every check passed. A first
  # headless `--editor --quit` pass is required before the script run: the
  # engine only discovers a project's .gdextension files while generating
  # its own project cache (`.godot/extension_list.cfg`), which running
  # `--script` directly, on a project the editor has never opened, skips
  # silently — found locally the same way the IL2CPP leg's own gaps were
  # found, by actually running it rather than assuming it would work.
  bindings-godot:
    name: bindings/godot headless verification (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            godot_asset: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_bin: Godot_v4.7.2-stable_linux.x86_64
            lib_src: target/debug/libfoldback_godot.so
            lib_dst: libfoldback_godot.so
          - os: windows-latest
            godot_asset: Godot_v4.7.2-stable_win64.exe.zip
            godot_bin: Godot_v4.7.2-stable_win64_console.exe
            lib_src: target/debug/foldback_godot.dll
            lib_dst: foldback_godot.dll
          - os: macos-latest
            godot_asset: Godot_v4.7.2-stable_macos.universal.zip
            godot_bin: Godot.app/Contents/MacOS/Godot
            lib_src: target/debug/libfoldback_godot.dylib
            lib_dst: libfoldback_godot.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p foldback-godot
      - name: Stage the native library into the addon's bin folder
        shell: bash
        run: |
          mkdir -p examples/godot-demo/addons/foldback/bin
          cp "${{ matrix.lib_src }}" "examples/godot-demo/addons/foldback/bin/${{ matrix.lib_dst }}"
      - name: Cache the Godot engine download
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-4.7.2-stable-${{ matrix.os }}
      - name: Download Godot 4.7.2-stable
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p godot-bin
          curl -fL -o godot-bin/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/${{ matrix.godot_asset }}"
          cd godot-bin && unzip -q godot.zip
      - name: Make the Godot binary executable
        if: runner.os != 'Windows'
        run: chmod +x "godot-bin/${{ matrix.godot_bin }}"
      - name: Generate the project's GDExtension cache
        shell: bash
        # `--quit` after a headless editor pass reliably exits non-zero
        # (observed locally too) even on a clean run — it's how this
        # invocation reports "quit as requested," not a failure signal —
        # so this step's job is only to produce `.godot/extension_list.cfg`
        # for the next step to find, not to gate on the exit code.
        run: |
          "godot-bin/${{ matrix.godot_bin }}" --headless --editor --path examples/godot-demo --quit || true
      - name: Run the headless verification script
        shell: bash
        run: |
          "godot-bin/${{ matrix.godot_bin }}" --headless --path examples/godot-demo --script res://test.gd \
            | tee godot-test-output.txt
          grep -q "^ALL PASS$" godot-test-output.txt

  # Fuzz smoke test for the `.foldback` session-file parser
  # (foldback-testing-plan.md §1.3's highest-value fuzz target: real files
  # from the wild, including corrupted/truncated/adversarial ones, must
  # never panic or hang the parser). `cargo-fuzz`/libFuzzer needs LLVM's
  # sanitizer-coverage runtime, which only links cleanly against a real
  # clang toolchain — confirmed not to work with MSVC's `link.exe`
  # (unresolved `__start___sancov_*` symbols) when tried locally, so
  # ubuntu-latest only, same "verify the actual platform constraint,
  # don't assume" lesson the IL2CPP/Godot CI legs already learned. A
  # short smoke run (bounded time), not a long fuzzing campaign — this is
  # about catching a regression on every push, not finding every bug in
  # one run.
  fuzz-smoke:
    name: fuzz smoke test (foldback-core session parser)
    needs: fmt-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/foldback-core/fuzz -> target
      - run: cargo install cargo-fuzz
      - run: cargo fuzz build --fuzz-dir crates/foldback-core/fuzz
      - run: |
          cargo fuzz run --fuzz-dir crates/foldback-core/fuzz parse-session-file -- \
            -max_total_time=60 -max_len=4096

  # cli-golden: golden-file tests against checked-in fixtures already run
  # as part of `core-test`'s `cargo test --workspace` (crates/foldback-cli
  # /tests/golden.rs) — no separate job needed while that stays fast
  # enough to live in the fast loop.
  #
  # ui-unit: Vitest component tests — added once foldback-ui exists.
