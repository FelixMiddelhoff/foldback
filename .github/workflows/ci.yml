name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fmt-and-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # foldback-ui (Tauri) needs these to even compile on Linux — without
      # them `cargo clippy --workspace` fails on missing system libs, not
      # a lint finding. Same list `core-test`'s ubuntu-latest leg needs.
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all -- --check
      # --all-features so feature-gated code (e.g. foldback-rs's `ggrs`
      # module, off by default) actually gets compiled and linted here —
      # without it, a break in a non-default feature ships invisibly.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  core-test:
    name: test (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace --all-features

  # Cross-platform (incl. ARM64) hash-equality job, per
  # foldback-ci-release-plan.md §4.2 and foldback-testing-plan.md §1.4: the
  # `hash::tests::known_vectors` test asserts a fixed input hashes to a
  # pinned constant, so running it on every OS/arch here *is* the
  # cross-platform byte-identical-hash assertion. Also runs the same test
  # at opt-level 0 and 3 to catch compiler-introduced non-determinism in
  # the hashing path itself (FMA contraction, float codegen differences —
  # see poncelet-planning/writing/blog-bitexact-fma-hunt.md for the bug
  # class this guards against), independent of the game's own code.
  #
  # Per §4.2: a failure here is a release blocker, never a flaky-retry
  # candidate — this is the one job that, if ever skipped "just this
  # once," undermines the entire product's premise.
  determinism:
    name: determinism (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: known vectors at opt-level 0
        run: cargo test -p foldback-core hash::tests::known_vectors
        env:
          RUSTFLAGS: "-C opt-level=0"
      - name: known vectors at opt-level 3
        run: cargo test -p foldback-core hash::tests::known_vectors
        env:
          RUSTFLAGS: "-C opt-level=3"

  # Builds the real foldback-sys native library and runs the Unity C#
  # binding's own P/Invoke harness (bindings/unity/Tests~/FoldbackSys.Tests)
  # against it — proves the C# struct marshaling/error handling actually
  # works against real compiled native code, not just that the C# compiles.
  # This is the plain .NET (Mono-equivalent) P/Invoke path — see
  # bindings-unity-il2cpp below for the actual Unity IL2CPP AOT leg.
  bindings-unity-cs:
    name: bindings/unity C# harness (${{ matrix.os }})
    needs: fmt-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cargo build -p foldback-sys
      - run: dotnet build -c Release bindings/unity/Tests~/FoldbackSys.Tests
      - name: Copy native library next to the test harness (Linux)
        if: runner.os == 'Linux'
        run: cp target/debug/libfoldback_sys.so bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/
      - name: Copy native library next to the test harness (macOS)
        if: runner.os == 'macOS'
        run: cp target/debug/libfoldback_sys.dylib bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/
      - name: Copy native library next to the test harness (Windows)
        if: runner.os == 'Windows'
        run: cp target/debug/foldback_sys.dll bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/
        shell: bash
      - run: dotnet bindings/unity/Tests~/FoldbackSys.Tests/bin/Release/net8.0/FoldbackSys.Tests.dll

  # The IL2CPP CI leg the risk register (P1) names as a Phase-3 "definition
  # of done" requirement — an actual Unity Editor, with the Windows Build
  # Support (IL2CPP) module, building and running examples/unity-demo
  # (Assets/Il2cppVerify.cs runs the same checks as the C# harness above,
  # but inside a real IL2CPP AOT player, which the Editor's own Mono
  # runtime never exercises). Locally proven working end to end on a real
  # Unity 6000.6.0f1 + IL2CPP install before this job was written (build
  # succeeded, the built player ran and printed PASS) — this job codifies
  # that exact sequence for CI, but hasn't itself completed a real run yet:
  # it needs `UNITY_EMAIL`/`UNITY_PASSWORD` (or
  # `UNITY_LICENSE`) repository secrets for a Unity license, which only a
  # maintainer with a Unity account can add (see foldback-ci-release-plan.md
  # §4.5's "secrets set up once, referenced by name" pattern) — treat this
  # job as unverified-in-CI until its first real run confirms both the
  # license activation and the `buildalon/unity-setup` invocation below.
  bindings-unity-il2cpp:
    name: bindings/unity IL2CPP player (windows-latest)
    needs: fmt-and-lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p foldback-sys
      - name: Stage the native library where the Unity project expects it
        shell: bash
        run: |
          mkdir -p examples/unity-demo/Assets/Plugins/x86_64
          cp target/debug/foldback_sys.dll examples/unity-demo/Assets/Plugins/x86_64/
      - uses: buildalon/unity-setup@v2
        with:
          unity-version: "6000.6.0f1"
          modules: windows-il2cpp
      - uses: buildalon/activate-unity-license@v2
        with:
          # Personal license (the default `license: personal`) only needs
          # username/password — no serial, that's Professional-only.
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - name: Build the IL2CPP player
        shell: bash
        run: |
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit \
            -projectPath examples/unity-demo \
            -executeMethod BuildScript.BuildIl2Cpp \
            -logFile examples/unity-demo/build.log
          cat examples/unity-demo/build.log
      - name: Run the IL2CPP player and check the result
        shell: bash
        env:
          FOLDBACK_IL2CPP_RESULT_PATH: examples/unity-demo/il2cpp-result.txt
        run: |
          examples/unity-demo/Build/FoldbackIl2CppTest.exe -batchmode -nographics -silent-crashes \
            -logFile examples/unity-demo/run.log
          cat examples/unity-demo/il2cpp-result.txt
          grep -q "^PASS$" examples/unity-demo/il2cpp-result.txt

  # cli-golden: golden-file tests against checked-in fixtures already run
  # as part of `core-test`'s `cargo test --workspace` (crates/foldback-cli
  # /tests/golden.rs) — no separate job needed while that stays fast
  # enough to live in the fast loop.
  #
  # ui-unit: Vitest component tests — added once foldback-ui exists.
