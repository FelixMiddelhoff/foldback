<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>foldback</title>
<style>
:root{
  --bg:#10131a;
  --surface:#171b24;
  --surface-2:#1e232e;
  --raised:#252b38;
  --border:#2c3241;
  --border-soft:#232838;
  --text:#e4e7ee;
  --text-dim:#8890a0;
  --text-faint:#5b6272;
  --accent:#7c8cff;
  --accent-dim:#4d5799;
  --ok:#4fd1a5;
  --warn:#e0b155;
  --crit:#ef7855;
  --crit-glow:rgba(239,120,85,0.18);
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.app{display:flex; flex-direction:column; height:100vh;}

.topbar{
  display:flex; align-items:center; gap:20px;
  padding:11px 18px; border-bottom:1px solid var(--border);
  background:var(--surface);
}
.wordmark{
  font-family:var(--mono); font-weight:600; font-size:14px; letter-spacing:0.02em;
  display:flex; align-items:center; gap:8px; color:var(--text);
}
.sep{width:1px; height:18px; background:var(--border);}
.session-meta{display:flex; gap:16px; color:var(--text-dim); font-size:12px; flex-wrap:wrap;}
.session-meta b{color:var(--text); font-weight:500;}
.session-meta .val{font-family:var(--mono); color:var(--text);}
.topbar-spacer{flex:1;}
.status-pill{
  display:flex; align-items:center; gap:6px;
  padding:5px 10px; border-radius:20px; background:var(--surface-2);
  border:1px solid var(--border); font-size:11.5px; color:var(--text-dim);
}
.dot{width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent);}
.btn{
  font-family:var(--sans); font-size:12px; font-weight:500; color:var(--text-dim);
  background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
  padding:6px 12px; cursor:pointer;
}
.btn:hover{color:var(--text); border-color:var(--accent-dim);}
.btn:disabled{opacity:0.5; cursor:default;}

.timeline-section{
  border-bottom:1px solid var(--border); background:var(--surface); padding:16px 18px 10px;
}
.timeline-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.timeline-title{font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-weight:600;}
.timeline-range{font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
#timeline{display:block; width:100%; height:96px; cursor:crosshair;}
.timeline-legend{display:flex; gap:18px; margin-top:6px; font-size:11px; color:var(--text-dim); flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px;}
.legend-swatch{width:9px; height:9px; border-radius:2px;}

.main{flex:1; display:grid; grid-template-columns: 340px 1fr; min-height:0;}
.panel{padding:16px 18px; overflow:auto;}
.panel + .panel{border-left:1px solid var(--border);}
.panel-title{
  font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint);
  font-weight:600; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;
}
.tick-badge{
  font-family:var(--mono); font-size:11px; border-radius:5px; padding:2px 7px;
}
.tick-badge.mismatch{color:var(--crit); background:var(--crit-glow); border:1px solid color-mix(in srgb, var(--crit) 45%, transparent);}
.tick-badge.match{color:var(--ok); background:color-mix(in srgb, var(--ok) 15%, transparent); border:1px solid color-mix(in srgb, var(--ok) 45%, transparent);}

.peer-row{
  display:grid; grid-template-columns: 20px 1fr auto; align-items:center; gap:10px;
  padding:10px 10px; border-radius:7px; border:1px solid var(--border-soft); margin-bottom:8px;
  background:var(--surface-2);
}
.peer-row.odd{border-color:color-mix(in srgb, var(--crit) 50%, var(--border)); background:linear-gradient(0deg, var(--crit-glow), var(--crit-glow)), var(--surface-2);}
.peer-dot{width:9px; height:9px; border-radius:50%;}
.peer-name{font-weight:500;}
.peer-name .tag{display:block; font-size:10.5px; color:var(--text-faint); font-weight:400; margin-top:1px;}
.peer-hash{font-family:var(--mono); font-size:12px; color:var(--text-dim); text-align:right;}
.peer-row.odd .peer-hash{color:var(--crit);}
.hint{
  margin-top:14px; padding:10px 12px; border-radius:7px; background:var(--surface-2);
  border:1px dashed var(--border); color:var(--text-dim); font-size:12px; line-height:1.55;
}
.hint code{font-family:var(--mono); background:var(--raised); padding:1px 5px; border-radius:4px; color:var(--text);}

.crumbs{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:14px;}
.crumbs b{color:var(--text); font-weight:500;}
.tree{border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.tree-row{
  display:grid; grid-template-columns: 22px 1fr auto; align-items:center;
  padding:9px 12px; border-bottom:1px solid var(--border-soft); background:var(--surface);
}
.tree-row:last-child{border-bottom:none;}
.tree-row.entity{background:var(--surface-2); font-weight:500;}
.tree-row.field{padding-left:34px; background:var(--surface);}
.tree-row.field.diverged{background:var(--crit-glow);}
.field-name{font-family:var(--mono); color:var(--text-dim); font-size:12px;}
.tree-row.diverged .field-name{color:var(--text);}
.diff-values{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px;}
.diff-values .a{color:var(--text-dim);}
.diff-values .b{color:var(--crit); font-weight:600;}
.diff-values .vs{color:var(--text-faint); font-size:10px;}

.verdict{
  margin-top:16px; padding:14px 16px; border-radius:8px;
  background:linear-gradient(180deg, var(--crit-glow), transparent 60%), var(--surface-2);
  border:1px solid color-mix(in srgb, var(--crit) 35%, var(--border));
}
.verdict-title{font-size:12px; font-weight:600; color:var(--crit); margin-bottom:5px;}
.verdict-body{font-size:12.5px; color:var(--text-dim); line-height:1.6;}
.verdict-body b{color:var(--text); font-weight:500;}
.verdict-actions{margin-top:10px; display:flex; gap:8px;}
.link-btn{
  font-size:11.5px; color:var(--accent); background:none; border:none; cursor:pointer; padding:0;
  font-family:var(--sans); font-weight:500;
}
.link-btn:hover{text-decoration:underline;}

.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:14px; color:var(--text-dim);
}
.empty-state .big{font-size:14px; color:var(--text);}
.error-banner{
  margin:14px 18px 0; padding:10px 12px; border-radius:7px;
  background:var(--crit-glow); border:1px solid color-mix(in srgb, var(--crit) 45%, transparent);
  color:var(--crit); font-size:12.5px;
}
[hidden]{display:none!important;}
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="wordmark">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 8C2 4.5 4.5 2 8 2s6 2.5 6 6-2.5 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M8 2v6l4.2 2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      foldback
    </div>
    <div class="sep"></div>
    <div class="session-meta" id="sessionMeta"><span style="color:var(--text-faint)">no session open</span></div>
    <div class="topbar-spacer"></div>
    <div class="status-pill"><span class="dot" aria-hidden="true"></span> offline replay</div>
    <button class="btn" id="openBtn" type="button">Open session…</button>
  </div>

  <div id="errorBanner" class="error-banner" hidden></div>

  <div id="emptyState" class="empty-state">
    <div class="big">No session open</div>
    <div>Drag a <code>.foldback</code> file onto this window, or open one, to inspect its tick timeline and any divergence.</div>
    <button class="btn" id="openBtn2" type="button">Open session…</button>
  </div>

  <div id="loadedView" hidden style="display:contents">
    <div class="timeline-section">
      <div class="timeline-head">
        <span class="timeline-title" id="timelineTitle">Tick timeline</span>
        <span class="timeline-range">viewing tick <strong id="ttHead" style="color:var(--text)">–</strong> · scrub or click the marker</span>
      </div>
      <canvas id="timeline" width="1200" height="96" role="img" aria-label="Tick timeline"></canvas>
      <div class="timeline-legend">
        <span class="legend-item"><span class="legend-swatch" style="background:var(--ok)"></span> peers agree</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--crit)"></span> divergence detected</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--accent)"></span> snapshot</span>
      </div>
    </div>

    <div class="main">
      <div class="panel">
        <div class="panel-title">Peers at tick <span id="peersTick">–</span> <span class="tick-badge" id="tickBadge"></span></div>
        <div id="peerRows"></div>
        <div class="hint" id="agreementHint"></div>

        <div class="panel-title" style="margin-top:22px">Session</div>
        <div class="hint" id="sessionHint" style="border-style:solid;"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Bisection result</div>
        <div class="crumbs" id="crumbs"></div>
        <div class="tree" id="tree"></div>
        <div id="verdict"></div>
      </div>
    </div>
  </div>

</div>

<script>
const { invoke } = window.__TAURI__.core;
const { open } = window.__TAURI__.dialog;

let session = null;      // raw SessionData from backend
let byTick = new Map();  // tick -> Map(peer_id -> hash)
let entityByTick = new Map();
let fieldByTick = new Map();
let selectedTick = null;

function hexShort(h){ return h.length > 12 ? h.slice(0,6) + '…' + h.slice(-4) : h; }

async function openSession(){
  const path = await open({
    multiple: false,
    filters: [{ name: 'Foldback session', extensions: ['foldback'] }],
  });
  if (!path) return;
  await loadPath(Array.isArray(path) ? path[0] : path);
}

async function loadPath(path){
  hideError();
  try {
    session = await invoke('load_session', { path });
  } catch (e) {
    showError(typeof e === 'string' ? e : JSON.stringify(e));
    return;
  }
  index(session);
  selectedTick = session.divergence_tick ?? session.max_tick;
  document.getElementById('emptyState').hidden = true;
  document.getElementById('loadedView').hidden = false;
  render();
}

function index(s){
  byTick = new Map();
  for (const r of s.tick_hashes){
    if (!byTick.has(r.tick)) byTick.set(r.tick, new Map());
    byTick.get(r.tick).set(r.peer_id, r.hash);
  }
  entityByTick = new Map();
  for (const e of s.entity_hashes){
    if (!entityByTick.has(e.tick)) entityByTick.set(e.tick, []);
    entityByTick.get(e.tick).push(e);
  }
  fieldByTick = new Map();
  for (const f of s.field_hashes){
    if (!fieldByTick.has(f.tick)) fieldByTick.set(f.tick, []);
    fieldByTick.get(f.tick).push(f);
  }
}

function tickAgrees(tick){
  const peers = byTick.get(tick);
  if (!peers || peers.size < 2) return null; // not enough data to judge
  const vals = [...peers.values()];
  return vals.every(h => h === vals[0]);
}

function showError(msg){
  const el = document.getElementById('errorBanner');
  el.textContent = msg;
  el.hidden = false;
}
function hideError(){ document.getElementById('errorBanner').hidden = true; }

function render(){
  renderTopbar();
  renderTimeline();
  renderPeers();
  renderSessionHint();
  renderDrilldown();
}

function renderTopbar(){
  const m = document.getElementById('sessionMeta');
  m.innerHTML =
    `<span><b>${escapeHtml(session.file_name)}</b></span>` +
    `<span>tick rate <span class="val">${session.tick_rate_hz}</span> Hz</span>` +
    `<span>peers <span class="val">${session.peer_count}</span></span>` +
    `<span>build <span class="val">${hexShort(session.build_id)}</span></span>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTimeline(){
  document.getElementById('timelineTitle').textContent =
    `Tick timeline — ${session.min_tick.toLocaleString()} to ${session.max_tick.toLocaleString()}`;
  document.getElementById('ttHead').textContent = selectedTick.toLocaleString();
  drawTimeline();
}

function renderPeers(){
  document.getElementById('peersTick').textContent = selectedTick.toLocaleString();
  const peers = byTick.get(selectedTick) || new Map();
  const agrees = tickAgrees(selectedTick);
  const badge = document.getElementById('tickBadge');
  if (agrees === null){
    badge.textContent = ''; badge.className = 'tick-badge';
  } else if (agrees){
    badge.textContent = 'match'; badge.className = 'tick-badge match';
  } else {
    badge.textContent = 'mismatch'; badge.className = 'tick-badge mismatch';
  }

  const rows = document.getElementById('peerRows');
  rows.innerHTML = '';
  if (peers.size === 0){
    rows.innerHTML = '<div class="hint">No peer reported a hash for this tick.</div>';
  } else {
    const vals = [...peers.values()];
    const majority = agrees === false ? mostCommon(vals) : vals[0];
    for (const [peerId, hash] of [...peers.entries()].sort((a,b)=>a[0]-b[0])){
      const odd = agrees === false && hash !== majority;
      const div = document.createElement('div');
      div.className = 'peer-row' + (odd ? ' odd' : '');
      div.innerHTML =
        `<span class="peer-dot" style="background:${odd ? 'var(--crit)' : 'var(--ok)'}"></span>` +
        `<span class="peer-name">Peer ${peerId}</span>` +
        `<span class="peer-hash">${hexShort(hash)}</span>`;
      rows.appendChild(div);
    }
  }

  const hint = document.getElementById('agreementHint');
  if (session.divergence_tick == null){
    hint.textContent = 'No divergence found in this session — every tick with 2+ reporting peers agrees.';
  } else {
    const lastGood = lastAgreeingTickBefore(session.divergence_tick);
    const nearestSnap = nearestSnapshotAtOrBefore(session.divergence_tick);
    hint.innerHTML =
      `First divergence: tick <code>${session.divergence_tick.toLocaleString()}</code>. ` +
      (lastGood != null ? `Last agreement: tick <code>${lastGood.toLocaleString()}</code>. ` : '') +
      (nearestSnap != null ? `Nearest snapshot at or before: tick <code>${nearestSnap.toLocaleString()}</code>.` : 'No snapshot at or before the divergence.');
  }
}

function mostCommon(vals){
  const counts = new Map();
  for (const v of vals) counts.set(v, (counts.get(v)||0)+1);
  return [...counts.entries()].sort((a,b)=>b[1]-a[1])[0][0];
}

function lastAgreeingTickBefore(tick){
  const ticks = [...byTick.keys()].filter(t => t < tick).sort((a,b)=>b-a);
  for (const t of ticks){
    if (tickAgrees(t)) return t;
  }
  return null;
}

function nearestSnapshotAtOrBefore(tick){
  const candidates = session.snapshot_ticks.filter(t => t <= tick);
  return candidates.length ? Math.max(...candidates) : null;
}

function renderSessionHint(){
  const hasEntity = session.entity_hashes.length > 0;
  const hasField = session.field_hashes.length > 0;
  const levels = ['tick'];
  if (hasEntity) levels.push('entity');
  if (hasField) levels.push('field');
  document.getElementById('sessionHint').innerHTML =
    `Levels available: ${levels.map(l => `<code>${l}</code>`).join(', ')}. ` +
    `Recording ${session.ended_cleanly ? 'ended cleanly' : 'did not end cleanly (no <code>EndOfStream</code> marker — likely a crash or truncation)'}. ` +
    `${session.metadata_count} metadata entries, ${session.snapshot_ticks.length} snapshots.`;
}

function renderDrilldown(){
  const crumbs = document.getElementById('crumbs');
  const tree = document.getElementById('tree');
  const verdict = document.getElementById('verdict');
  crumbs.innerHTML = `<b>tick ${selectedTick.toLocaleString()}</b>`;
  verdict.innerHTML = '';

  const entities = entityByTick.get(selectedTick) || [];
  if (entities.length === 0){
    tree.innerHTML = `<div class="hint" style="margin:0;">No entity- or field-level hashes recorded for this tick. Level 2/3 bisection (per-entity, per-field) lands in Phase 2 — this session only has Level 1 (per-tick) data.</div>`;
    return;
  }

  const byEntity = new Map();
  for (const e of entities){
    if (!byEntity.has(e.entity_id)) byEntity.set(e.entity_id, []);
    byEntity.get(e.entity_id).push(e);
  }
  const fields = fieldByTick.get(selectedTick) || [];
  const fieldsByEntity = new Map();
  for (const f of fields){
    if (!fieldsByEntity.has(f.entity_id)) fieldsByEntity.set(f.entity_id, []);
    fieldsByEntity.get(f.entity_id).push(f);
  }

  tree.innerHTML = '';
  for (const [entityId, hashes] of byEntity){
    const agrees = new Set(hashes.map(h => h.hash)).size <= 1;
    const row = document.createElement('div');
    row.className = 'tree-row entity';
    row.innerHTML =
      `<span class="caret">▾</span><span>Entity #${entityId}</span>` +
      `<span style="color:${agrees ? 'var(--ok)' : 'var(--crit)'}; font-family:var(--mono); font-size:11px;">${agrees ? 'match' : 'diverges'}</span>`;
    tree.appendChild(row);

    if (!agrees){
      const entFields = fieldsByEntity.get(entityId) || [];
      const byName = new Map();
      for (const f of entFields){
        if (!byName.has(f.field_name)) byName.set(f.field_name, []);
        byName.get(f.field_name).push(f);
      }
      for (const [name, vals] of byName){
        const diverged = new Set(vals.map(v => v.hash)).size > 1;
        const frow = document.createElement('div');
        frow.className = 'tree-row field' + (diverged ? ' diverged' : '');
        if (diverged){
          const sorted = [...vals].sort((a,b)=>a.peer_id-b.peer_id);
          frow.innerHTML =
            `<span></span><span class="field-name">${escapeHtml(name)}</span>` +
            `<div class="diff-values">${sorted.map(v => `<span>P${v.peer_id}:${v.value_hex || v.hash}</span>`).join('<span class="vs">vs</span>')}</div>`;
          crumbs.innerHTML = `<b>tick ${selectedTick.toLocaleString()}</b><span class="arrow">›</span><b>Entity #${entityId}</b><span class="arrow">›</span><span>${escapeHtml(name)}</span>`;
          verdict.innerHTML =
            `<div class="verdict">` +
            `<div class="verdict-title">⚠ Field-level divergence</div>` +
            `<div class="verdict-body"><b>${escapeHtml(name)}</b> on entity #${entityId} differs between peers at tick ${selectedTick.toLocaleString()} — raw values shown above. Foldback doesn't guess a root cause; compare the byte values against your simulation code for this field.</div>` +
            `</div>`;
        } else {
          frow.innerHTML = `<span></span><span class="field-name">${escapeHtml(name)}</span><span style="color:var(--text-faint); font-family:var(--mono); font-size:11px;">match</span>`;
        }
        tree.appendChild(frow);
      }
    }
  }
}

function drawTimeline(){
  const canvas = document.getElementById('timeline');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 1200, h = canvas.clientHeight || 96;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const style = getComputedStyle(document.documentElement);
  const cssVar = n => style.getPropertyValue(n).trim();
  const ok = cssVar('--ok'), crit = cssVar('--crit'), accent = cssVar('--accent'),
        border = cssVar('--border'), dim = cssVar('--text-dim');

  const pad = 6;
  const axisY = h - 22;
  const trackTop = 14, trackH = axisY - trackTop - 6;
  const lo = session.min_tick, hi = Math.max(session.max_tick, lo + 1);
  const x = tick => pad + ((tick - lo) / (hi - lo)) * (w - pad*2);

  ctx.fillStyle = ok; ctx.globalAlpha = 0.55;
  ctx.fillRect(pad, trackTop, w - pad*2, trackH);
  ctx.globalAlpha = 1;

  if (session.divergence_tick != null){
    const divX = x(session.divergence_tick);
    ctx.fillStyle = crit;
    ctx.fillRect(divX, trackTop, (w-pad) - divX, trackH);
  }

  for (const t of session.snapshot_ticks){
    ctx.fillStyle = accent;
    ctx.fillRect(x(t)-1, trackTop-4, 2, trackH+4);
  }

  ctx.strokeStyle = border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, axisY); ctx.lineTo(w-pad, axisY); ctx.stroke();

  ctx.fillStyle = dim;
  ctx.font = '10.5px IBM Plex Mono, monospace';
  ctx.textBaseline = 'top';
  const step = Math.max(1, Math.ceil((hi - lo) / 6));
  for (let t = lo; t <= hi; t += step){
    ctx.fillText(Math.round(t).toLocaleString(), x(t) - 10, axisY+10);
  }

  if (session.divergence_tick != null){
    const divX = x(session.divergence_tick);
    const dy = trackTop + trackH/2;
    ctx.beginPath();
    ctx.arc(divX, dy, 12, 0, Math.PI*2);
    ctx.fillStyle = crit; ctx.globalAlpha = 0.15; ctx.fill(); ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(divX, dy); ctx.rotate(Math.PI/4);
    ctx.fillStyle = crit; ctx.fillRect(-5,-5,10,10);
    ctx.restore();
    ctx.fillStyle = crit;
    ctx.font = '600 11px IBM Plex Mono, monospace';
    ctx.fillText('tick ' + session.divergence_tick.toLocaleString(), divX - 30, trackTop - 12);
  }

  // selection marker
  const selX = x(selectedTick);
  ctx.strokeStyle = accent; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(selX, trackTop-4); ctx.lineTo(selX, axisY+4); ctx.stroke();

  canvas._xToTick = px => {
    const frac = Math.min(1, Math.max(0, (px - pad) / (w - pad*2)));
    return Math.round(lo + frac * (hi - lo));
  };
}

function selectTick(tick){
  selectedTick = Math.max(session.min_tick, Math.min(session.max_tick, tick));
  render();
}

document.getElementById('timeline').addEventListener('click', e => {
  if (!session) return;
  const canvas = e.currentTarget;
  const rect = canvas.getBoundingClientRect();
  const tick = canvas._xToTick(e.clientX - rect.left);
  selectTick(tick);
});

document.getElementById('openBtn').addEventListener('click', openSession);
document.getElementById('openBtn2').addEventListener('click', openSession);
window.addEventListener('resize', () => { if (session) drawTimeline(); });

// Zero-config UX principle (foldback-plan.md §4.3): drag a .foldback file
// onto the window, no dialog needed. Tauri delivers this as a window
// event (webview drag&drop is disabled in favor of this), not a browser
// 'drop' DOM event.
window.__TAURI__.event.listen('tauri://drag-drop', (event) => {
  const paths = (event.payload && event.payload.paths) || [];
  const path = paths.find(p => p.toLowerCase().endsWith('.foldback')) || paths[0];
  if (path) loadPath(path);
});
</script>
