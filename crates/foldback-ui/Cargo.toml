[package]
name = "foldback-ui"
description = "Foldback UI — Tauri desktop app for inspecting .foldback session files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
foldback-core = { path = "../foldback-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tungstenite = "0.30"

[dev-dependencies]
foldback-core = { path = "../foldback-core", features = ["live"] }
