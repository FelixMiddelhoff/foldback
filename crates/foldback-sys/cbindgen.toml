# foldback.h is GENERATED from this crate's #[no_mangle] extern "C" surface.
# Never hand-edit the generated header — regenerate it instead.
# See: foldback-protocol-spec.md's "source of truth" rule.

# cpp_compat: found necessary by bindings/unreal, the first consumer of
# this header that actually compiles it as C++ (Unity's C# P/Invoke and
# Godot's gdext never do). Without it, the plain C fallback path for
# `enum FoldbackStatus`'s backing-type declaration + typedef genuinely
# fails to compile under MSVC/Clang in C++ mode (a real
# redefinition error, not a style nit) — this makes cbindgen guard that
# path with `#ifdef __cplusplus` and add its own `extern "C" { ... }`
# wrapper, so C++ consumers no longer need to add their own.
language = "C"
cpp_compat = true
header = "/* Auto-generated by cbindgen from foldback-sys. Do not edit by hand. */"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_guard = "FOLDBACK_H"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true

[export]
prefix = "Foldback"

[parse]
parse_deps = false
