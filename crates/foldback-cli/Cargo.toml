[package]
name = "foldback-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "foldback"
path = "src/main.rs"

[dependencies]
foldback-core = { path = "../foldback-core" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
syn = { version = "3.0.5", features = ["full"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
